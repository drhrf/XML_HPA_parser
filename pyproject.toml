[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hpa-xml-parser"
dynamic = ["version"]
description = "Extract per-sample RNA expression (nTPM, sex, age) from Human Protein Atlas per-gene XML files."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Hércules Rezende Freitas" }]
keywords = ["Human Protein Atlas", "RNA-seq", "nTPM", "brain", "bioinformatics", "XML"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "pandas>=1.3",
    "requests>=2.25",
    "openpyxl>=3.0",
]

[project.optional-dependencies]
parquet = ["pyarrow>=7"]
test = ["pytest>=7"]
dev = ["pytest>=7", "ruff>=0.4", "pyarrow>=7"]

[project.scripts]
hpa-xml-parser = "hpa_xml_parser.cli:main"

[project.urls]
Homepage = "https://github.com/drhrf/XML_HPA_parser"
Issues = "https://github.com/drhrf/XML_HPA_parser/issues"

[tool.setuptools.dynamic]
version = { attr = "hpa_xml_parser._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
